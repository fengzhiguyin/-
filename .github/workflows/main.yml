name: Global AdBlock Clean Factory
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Process Scripts
        run: |
          # 换用 statically.io 镜像，避免 jsdelivr 节点抖动
          declare -A scripts=(
            ["youtube.js"]="https://statically.io"
            ["global_ads.js"]="https://statically.io"
          )

          for name in "${!scripts[@]}"; do
            echo "Attempting to download $name..."
            # 使用简化的 curl 参数，增加重试
            curl -fSsl --retry 3 --connect-timeout 20 "${scripts[$name]}" -o "$name" || exit 1
            
            # 【暴力脱敏】物理隔绝脚本联网权限
            sed -i 's/\$httpClient\.post/console.log/g' "$name"
            sed -i 's/\$httpClient\.get/console.log/g' "$name"
            sed -i 's/\$httpClient\.put/console.log/g' "$name"
            sed -i 's/fetch(/console.log(/g' "$name"
            
            echo "// Cleaned and Verified at $(date)" | cat - "$name" > temp && mv temp "$name"
            echo "Successfully processed $name"
          done

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Manual sync: Safe scripts $(date)" || exit 0
          git push
