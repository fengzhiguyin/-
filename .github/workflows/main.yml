name: Global AdBlock Clean Factory
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Process Scripts
        run: |
          # 换用 Statically CDN 镜像，强制绕过 githubusercontent 解析问题
          declare -A scripts=(
            ["youtube.js"]="https://statically.io"
            ["global_ads.js"]="https://statically.io"
          )

          for name in "${!scripts[@]}"; do
            echo "Downloading $name via Statically CDN..."
            # 增加 -L (跟随重定向) 和多次重试
            curl -fSsl -L --retry 5 --retry-delay 5 --connect-timeout 30 "${scripts[$name]}" -o "$name" || exit 1
            
            # 【核心脱敏】物理切断联网上传权限，保障隐私安全
            sed -i 's/\$httpClient\.post/console.log/g' "$name"
            sed -i 's/\$httpClient\.get/console.log/g' "$name"
            sed -i 's/\$httpClient\.put/console.log/g' "$name"
            sed -i 's/fetch(/console.log(/g' "$name"
            
            echo "// Cleaned by Factory at $(date)" | cat - "$name" > temp && mv temp "$name"
            echo "Successfully processed $name"
          done

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "CDN Sync Update $(date)" || exit 0
          git push
