name: Global AdBlock Clean Factory
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Process Scripts
        run: |
          # 修正后的最强全量下载源
          declare -A scripts=(
            ["youtube.js"]="https://githubusercontent.com"
            ["global_ads.js"]="https://githubusercontent.com"
          )

          for name in "${!scripts[@]}"; do
            echo "Downloading $name..."
            # 增加 -L 解决跳转问题
            curl -fSsl -L --retry 5 --connect-timeout 20 "${scripts[$name]}" -o "$name" || exit 1
            
            # 【核心安全脱敏】物理切断联网上传权限
            sed -i 's/\$httpClient\.post/console.log/g' "$name"
            sed -i 's/\$httpClient\.get/console.log/g' "$name"
            sed -i 's/\$httpClient\.put/console.log/g' "$name"
            sed -i 's/fetch(/console.log(/g' "$name"
            
            echo "// Cleaned by Factory at $(date)" | cat - "$name" > temp && mv temp "$name"
          done

      - name: Commit and Push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Final Clean Update $(date)" || exit 0
          git push
